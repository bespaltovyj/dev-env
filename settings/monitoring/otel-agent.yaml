# ================================================================ otel-agent (сеть хоста VM)
# node-exporter слушает в сети самой VM, а bridge-сети rootless podman её не видят.
# Агент работает там же, забирает метрики node-exporter и передаёт их в otel-collector
# через его опубликованный порт 127.0.0.1:4318.

receivers:
  prometheus:
    config:
      global:
        scrape_interval: 30s
      scrape_configs:
        - job_name: node
          static_configs:
            - targets: ["127.0.0.1:9100"]

processors:
  batch: {}

exporters:
  otlp_http:
    endpoint: http://127.0.0.1:4318

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlp_http]
