# ================================================================ agent-box
# Запуск agent-box. Формат Compose Specification: работает с `docker compose` и `podman compose`.
# Образ собирается заранее скриптом scripts/build/build.ps1 / build.sh.
#
#   cp .env.example .env                          # заполнить переменные
#   docker compose up -d     | podman compose up -d
#   docker compose exec agent tmux new -A -s main # подключиться (повторный вызов — к той же сессии)
#   docker compose down      | podman compose down
#
# Мониторинг (профиль monitoring): otel-collector, VictoriaMetrics/Logs/Traces, vmauth (один VMUI),
# Grafana, squid-exporter, node-exporter, cAdvisor. Без профиля эти сервисы не запускаются:
#   podman compose --profile monitoring up -d     | COMPOSE_PROFILES=monitoring в .env
#
# .env используется дважды:
#   1. compose подставляет из него ${...} в этот файл (AGENT_IMAGE, AGENT_MEMORY, ...);
#   2. env_file передаёт все его переменные внутрь контейнера.

name: agent-box

services:
  agent:
    image: ${AGENT_IMAGE:-localhost/agent-box:latest}
    pull_policy: never
    hostname: agent-box
    stdin_open: true
    tty: true
    # Контейнер живёт постоянно, работа идёт через `exec` и tmux-сессии
    command: ["sleep", "infinity"]
    restart: unless-stopped

    # ============================================================ переменные окружения
    env_file:
      - path: .env
        required: false
    # Выход в интернет только через egress (environment важнее .env).
    # Maven/Gradle: scripts/build/entrypoint.sh пишет прокси в ~/.m2 и ~/.gradle из HTTPS_PROXY
    environment:
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      # otel-collector (профиль monitoring) — в той же сети agent-internal, без прокси
      NO_PROXY: localhost,127.0.0.1,::1,otel-collector
      no_proxy: localhost,127.0.0.1,::1,otel-collector
      # fetch в Node.js без этого прокси не использует
      NODE_USE_ENV_PROXY: "1"
      # Весь конфиг Claude Code, включая .claude.json, — в смонтированной папке data/claude
      CLAUDE_CONFIG_DIR: /home/agent/.claude
      # История bash в смонтированной data/bash
      HISTFILE: /home/agent/.local/state/bash/history

    # ============================================================ сеть
    # agent-internal без выхода наружу и внешнего DNS: интернет только через egress.
    # orca-ide serve (scripts/build/entrypoint.sh): только localhost, Orca на Windows подключается к 127.0.0.1.
    # Не 6768: его на Windows занимает рантайм десктопного Orca
    networks:
      - agent-internal
    ports:
      - "127.0.0.1:${ORCA_PORT:-6769}:${ORCA_PORT:-6769}"
    depends_on:
      - egress

    # ============================================================ данные
    # keep-id: пользователь VM (uid 1000, владелец папок с Windows) = agent (uid 1000) в контейнере,
    # иначе agent не может писать в смонтированные папки
    userns_mode: keep-id
    volumes:
      # Named volume на диске VM: кэши npm/Maven/Gradle/Go и прочий /home/agent.
      # Удаляется только `down -v` и пересозданием машины
      - agent-home:/home/agent
      # Git-репозитории всех агентов: /repos = data/repos на Windows.
      # Worktree Orca (workspaceDir по умолчанию ~/orca/workspaces) — в data/repos/orca-worktrees
      - ./data/repos:/repos
      - ./data/repos/orca-worktrees:/home/agent/orca/workspaces
      # Claude Code контейнера (не ~/.claude хоста): логин, сессии, история, settings.json — data/claude;
      # инструкции агентам — статический settings/claude/CLAUDE.md, только чтение
      - ./data/claude:/home/agent/.claude
      - ./settings/claude/CLAUDE.md:/home/agent/.claude/CLAUDE.md:ro
      # Orca на Windows (data/orca): сессии, рабочие пространства, история терминалов, сопряжение, секреты
      - ./data/orca/config:/home/agent/.config/orca
      - ./data/orca/home:/home/agent/.orca
      # Рантайм orcad (~150 МБ, скачивается с nodejs.org) — кэш, в named volume
      - orcad-artifacts:/home/agent/.config/orca/orcad-artifacts
      # История bash (HISTFILE)
      - ./data/bash:/home/agent/.local/state/bash

    # ============================================================ ограничения
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AGENT_MEMORY:-4g}
    cpus: ${AGENT_CPUS:-2}
    pids_limit: ${AGENT_PIDS:-1024}

  # ============================================================== egress
  # squid: пропускает в интернет только домены из settings/egress/allowlist.txt.
  # Конфиг монтируется с хоста: после правки — podman restart agent-box-egress-1.
  # Лог запросов: podman logs agent-box-egress-1
  egress:
    image: ${EGRESS_IMAGE:-localhost/agent-box-egress:latest}
    pull_policy: never
    restart: unless-stopped
    networks:
      - agent-internal
      - outside
    # squid-exporter работает в сетевом пространстве egress, поэтому его порт публикуется здесь
    ports:
      - "127.0.0.1:9301:9301"
    # Файлами, а не папкой: в /etc/squid остаются mime.conf и conf.d из пакета
    volumes:
      - ./settings/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./settings/egress/allowlist.txt:/etc/squid/allowlist.txt:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256

  # ============================================================== мониторинг (профиль monitoring)
  # Все данные идут через otel-collector, хранятся в Victoria*, данные на Windows — data/monitoring.
  # Все порты только на 127.0.0.1.

  # Приём: OTLP (4317 gRPC, 4318 HTTP), Prometheus remote write (9090), scrape экспортеров и стека.
  # В agent-internal: приложения в agent шлют телеметрию на otel-collector:4318 напрямую
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.164.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./settings/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - monitoring
      - agent-internal
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:8888:8888"
    depends_on:
      - victoria-metrics
      - victoria-logs
      - victoria-traces
    mem_limit: 512m

  # Сеть хоста VM: забирает метрики node-exporter и отдаёт их в otel-collector (127.0.0.1:4318)
  otel-agent:
    image: docker.io/otel/opentelemetry-collector-contrib:0.164.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./settings/monitoring/otel-agent.yaml:/etc/otelcol/config.yaml:ro
    network_mode: host
    depends_on:
      - otel-collector
      - node-exporter
    mem_limit: 128m

  # Метрики самой VM (Fedora CoreOS): сеть и PID хоста, корень VM только для чтения.
  # Порт 9100 слушает в сети VM (127.0.0.1) — на Windows не пробрасывается, читает otel-agent
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 128m

  # Метрики контейнеров (CPU, память, сеть, диск) по cgroups. Podman rootless: корень cgroup недоступен,
  # поэтому вместо него — поддерево пользователя VM core (uid 1000), где живут все его контейнеры;
  # SELinux запрещает inotify на cgroups из контейнера — метка отключена только здесь.
  # Сокет podman нужен для имён контейнеров: он даёт полный доступ к podman пользователя core,
  # поэтому у cAdvisor только внутренняя сеть monitoring
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --podman=unix:///var/run/podman/podman.sock
      - --docker_only=false
      - --housekeeping_interval=30s
      - --store_container_labels=false
    security_opt:
      - label=disable
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup/user.slice/user-1000.slice/user@1000.service:/sys/fs/cgroup:ro
      - /dev/disk:/dev/disk:ro
      - /run/user/1000/podman/podman.sock:/var/run/podman/podman.sock:ro
    networks: [monitoring]
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 256m

  # Счётчики squid из cache manager; в сетевом пространстве egress (доступ manager только с localhost)
  squid-exporter:
    image: docker.io/boynux/squid-exporter:v1.13.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      SQUID_HOSTNAME: localhost
      SQUID_PORT: "3128"
      SQUID_EXPORTER_LISTEN: ":9301"
    network_mode: service:egress
    depends_on:
      - egress
    mem_limit: 64m

  victoria-metrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.155.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${METRICS_RETENTION:-30d}
    volumes:
      - ./data/monitoring/victoria-metrics:/storage
    networks: [monitoring]
    ports:
      - "127.0.0.1:8428:8428"
    mem_limit: 1g

  victoria-logs:
    image: docker.io/victoriametrics/victoria-logs:v1.53.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${LOGS_RETENTION:-14d}
    volumes:
      - ./data/monitoring/victoria-logs:/storage
    networks: [monitoring]
    ports:
      - "127.0.0.1:9428:9428"
    mem_limit: 512m

  victoria-traces:
    image: docker.io/victoriametrics/victoria-traces:v0.12.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${TRACES_RETENTION:-7d}
    volumes:
      - ./data/monitoring/victoria-traces:/storage
    networks: [monitoring]
    ports:
      - "127.0.0.1:10428:10428"
    mem_limit: 512m

  # Один вход во все VMUI: /vmui/, /logs/select/vmui/, /traces/select/vmui/ (settings/monitoring/vmauth.yaml)
  vmauth:
    image: docker.io/victoriametrics/vmauth:v1.155.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["-auth.config=/etc/vmauth/config.yaml"]
    volumes:
      - ./settings/monitoring/vmauth.yaml:/etc/vmauth/config.yaml:ro
    networks: [monitoring]
    ports:
      - "127.0.0.1:8427:8427"
    depends_on:
      - victoria-metrics
      - victoria-logs
      - victoria-traces
    mem_limit: 64m

  # Образ собирают scripts/build (images/monitoring/grafana.Dockerfile): плагин VictoriaLogs ставится
  # при сборке, в работе выхода в интернет нет. БД не нужна: пользователи и дашборды — во встроенной
  # SQLite (data/monitoring/grafana), источники данных — settings/monitoring/grafana/provisioning.
  # root: папки с Windows принадлежат пользователю VM, а он в rootless-контейнере — root
  grafana:
    image: ${GRAFANA_IMAGE:-localhost/agent-box-grafana:latest}
    pull_policy: never
    profiles: [monitoring]
    restart: unless-stopped
    user: "0"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Без обращений в интернет: статистика, проверка обновлений, новости
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./data/monitoring/grafana:/var/lib/grafana
      - ./settings/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [monitoring]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - victoria-metrics
      - victoria-logs
      - victoria-traces
    mem_limit: 512m

networks:
  # Без маршрута наружу и внешнего DNS
  agent-internal:
    internal: true
  # Обычная сеть с выходом в интернет — только у egress
  outside: {}
  # Стек мониторинга, без выхода в интернет (порты на 127.0.0.1 публикуются и во внутреннюю сеть)
  monitoring:
    internal: true

# Имена в podman: agent-box_agent-home, agent-box_orcad-artifacts
volumes:
  agent-home: {}
  orcad-artifacts: {}
